
<main>
  <section class="sidebar-section">
    <app-sidebar [homeLink]="{ route: '/main' }" [menuIcons]="icons"></app-sidebar>
  </section>

  <div class="title">
    <h2>Avaliação de Desenvolvimento Individual</h2>
  </div>

  <div class="navigate">
    <div class="content-left">
      <app-back-button></app-back-button>

      <div>
        <app-breadcrumb [breadcrumbItems]="breadcrumbItems"></app-breadcrumb>
      </div>
    </div>

    <div class="new-adi-btn" (click)="onRegisterNewAdi()" (keydown)="onRegisterNewAdi()" tabindex="0">
      Registrar novo PDI
      <mat-icon>add_circle_outline</mat-icon>
    </div>
  </div>

  <div class="student-informations">
    <h4>{{ nomeDoEstudante }}</h4>
    <span>{{ apelidoTurma }}</span>
  </div>

  <div class="history-ADIs">
    <h4>Histórico de ADIs</h4>

    <div class="ADIs-list">
      <ng-container *ngFor="let adi of adisData.evaluations">
        <div class="ADI-item">
          {{ adi.label }}
          <mat-icon>search</mat-icon>
        </div>
      </ng-container>
    </div>
  </div>

  <div class="last-ADI">
    <h4>Última avaliação</h4>
    <span>{{ adisData.latestEvaluation.date }}</span>

    <div class="chart-container">
      <echarts [options]="chartOptions" class="echart"></echarts>
    </div>

    <button (click)="onVisualizarClick()" (keydown)="onVisualizarClick()" >Visualizar</button>
  </div>
</main>
