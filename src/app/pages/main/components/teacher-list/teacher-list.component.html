<div *ngIf="isLoading" class="loading-spinner">
  <!-- Spinner de carregamento -->
  <mat-spinner></mat-spinner>
</div>

<main *ngIf="!isLoading">
  <section class="sidebar-section">
    <app-sidebar [homeLink]="{ route: '/' }" [menuIcons]="icons"></app-sidebar>
  </section>

  <div class="title">
    <h2>Psicólogos cadastrados</h2>
  </div>

  <div class="search">
    <app-back-button></app-back-button>
    <div class="input-wrapper">
      <input
        #searchInput
        type="text"
        (input)="onSearch(searchInput.value)"
      />
      <span class="icon-search">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
        </svg>
      </span>
    </div>
  </div>

  <section class="main-section">

    <div *ngIf="isLoadingSearch" class="loading-spinner-search">
      <mat-spinner></mat-spinner>
    </div>

    <div *ngIf="teachers.length === 0 && !isLoadingSearch" class="empty-state">
      <h3>Nenhum psicólogo encontrado como resultado dessa pesquisa</h3>
      <p>Tente novamente ou registre novos psicólogos para começar a acompanhar.</p>
    </div>

    <div class="content-wrapper" *ngIf="!isLoadingSearch">
      <app-list *ngFor="let teacher of teachers"
        tipo="psicologo"
        [nomeCompleto]="teacher.fullName"
        [matricula]="'CRP: ' + teacher.registrationNumber"
        [apelidosTurmas]="teacherClassesNames[teacher.registrationNumber]"
        [id]="teacher.id"
        (selecionado)="onNavigateToUpdateTeacher($event)">
      </app-list>
    </div>
  </section>
</main>
