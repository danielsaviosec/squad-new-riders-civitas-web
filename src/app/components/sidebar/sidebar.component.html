<section class="sidebar-section">
    <div class="sidebar">
        <div class="top-icon" *ngFor="let option of logoDesktop">
            <a [routerLink]="[homeLink.route]" class="logo-link">
                <img alt="image desktop" [src]="option.image">
            </a>
        </div>
        <div class="sidebar-menu">
            <div class="menu" *ngFor="let option of menuIcons">
                <button (click)="navigateTo(option.route)" class="btn-menu">
                    <img alt="image icons" class="svg" [src]="option.image">
                    {{option.name}}
                </button>
            </div>
        </div>
        <div class="mobile">
            <button mat-icon-button [matMenuTriggerFor]="mobileMenu">
                <mat-icon>menu</mat-icon>
            </button>
            <img *ngFor="let option of logoMobile" alt="image mobile" [src]="option.image">
            <mat-menu #mobileMenu="matMenu">
                <button class="btn-mobile" mat-menu-item *ngFor="let option of menuIcons" (click)="navigateTo(option.route)">
                    <!-- <img alt="image icons" class="svg" [src]="option.image"> -->
                    <span>{{option.name}}</span>
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="logout()">
                    <mat-icon>exit_to_app</mat-icon>
                    <span>Sair</span>
                </button>
            </mat-menu>
        </div>
        <div class="logout-box">
            <button (click)="logout()">Sair</button>
            <span>V.1.0.0</span>
        </div>
    </div>
</section>
