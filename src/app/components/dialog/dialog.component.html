<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content [innerHTML]="data.content"></mat-dialog-content>
<mat-dialog-actions align="start">
  <button *ngIf="!data.hasError" mat-button color="warn" (click)="confirmDelete()">Excluir</button>
  <button mat-button color="primary" (click)="closeDialog()">Voltar</button>
</mat-dialog-actions>
